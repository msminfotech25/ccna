<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCNA Online Exam</title>

<style>
body{
  font-family: Arial;
  background:#0f2027;
  background:linear-gradient(to right,#2c5364,#203a43,#0f2027);
  color:#fff;
}
.container{
  width:90%;
  margin:auto;
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:10px;
}
h1,h2{text-align:center;color:#ffd700}
.question{
  background:rgba(255,255,255,0.1);
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}
button{
  padding:10px 20px;
  font-size:16px;
  background:#ffd700;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#timer{text-align:center;font-size:20px;color:#ff4444}
</style>
</head>

<body>

<div class="container">
<h1>CCNA Online Exam</h1>
<p id="timer"></p>

<label>Student Name:
<input type="text" id="student"></label>
<br><br>

<button onclick="startExam()">Start Exam</button>

<form id="quiz"></form>

<button onclick="submitExam()">Submit Exam</button>

<h2 id="result"></h2>
</div>

<script>
/* ================== 100 QUESTIONS ================== */
const questions = [
{q:"Layer 1 device?",o:["Router","Switch","Hub","Firewall"],a:"Hub"},
{q:"OSI layers count?",o:["5","6","7","8"],a:"7"},
{q:"Private IP?",o:["8.8.8.8","192.168.1.1","1.1.1.1","172.40.1.1"],a:"192.168.1.1"},
{q:"MAC address size?",o:["32","48","64","128"],a:"48"},
{q:"ARP does?",o:["MAC→IP","IP→MAC","IP→Port","Port→IP"],a:"IP→MAC"},
{q:"Layer 3 protocol?",o:["ARP","IP","FTP","HTTP"],a:"IP"},
{q:"Default HTTP port?",o:["21","22","80","443"],a:"80"},
{q:"UDP used for?",o:["File transfer","Streaming","Email","FTP"],a:"Streaming"},
{q:"Loopback IP?",o:["0.0.0.0","127.0.0.1","255.255.255.255","1.1.1.1"],a:"127.0.0.1"},
{q:"Broadcast IP of 192.168.1.0/24?",o:["192.168.1.1","192.168.1.254","192.168.1.255","192.168.0.255"],a:"192.168.1.255"},

{q:"Subnet mask /26?",o:["255.255.255.0","255.255.255.128","255.255.255.192","255.255.255.224"],a:"255.255.255.192"},
{q:"WAN link subnet?",o:["/24","/27","/30","/16"],a:"/30"},
{q:"Layer 2 device?",o:["Router","Switch","Firewall","Server"],a:"Switch"},
{q:"Collision domain broken by?",o:["Hub","Switch","Repeater","Cable"],a:"Switch"},
{q:"Broadcast domain broken by?",o:["Hub","Switch","Router","Bridge"],a:"Router"},
{q:"Class C default mask?",o:["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.252"],a:"255.255.255.0"},
{q:"Which is NOT private?",o:["10.0.0.1","172.20.1.1","192.168.1.1","172.50.1.1"],a:"172.50.1.1"},
{q:"DNS port?",o:["21","25","53","110"],a:"53"},
{q:"TCP type?",o:["Connectionless","Connection-oriented","Broadcast","Multicast"],a:"Connection-oriented"},
{q:"FTP port?",o:["21","22","23","25"],a:"21"},

{q:"HTTPS port?",o:["80","110","443","8080"],a:"443"},
{q:"SMTP port?",o:["25","53","80","443"],a:"25"},
{q:"Which is multicast?",o:["192.168.1.1","224.0.0.1","127.0.0.1","255.255.255.255"],a:"224.0.0.1"},
{q:"IPv4 bits?",o:["16","32","64","128"],a:"32"},
{q:"IPv6 bits?",o:["64","96","128","256"],a:"128"},
{q:"Ping uses?",o:["TCP","UDP","ICMP","ARP"],a:"ICMP"},
{q:"Tracert shows?",o:["Speed","Route","MAC","Port"],a:"Route"},
{q:"Which is LAN?",o:["MAN","WAN","PAN","Ethernet"],a:"Ethernet"},
{q:"Which is NOT topology?",o:["Star","Bus","Mesh","Protocol"],a:"Protocol"},
{q:"Ring topology issue?",o:["High cost","Single point failure","Slow","Secure"],a:"Single point failure"},

{q:"Mesh advantage?",o:["Low cost","High redundancy","Simple","Slow"],a:"High redundancy"},
{q:"Switch works using?",o:["IP","MAC","Port","VLAN"],a:"MAC"},
{q:"Router uses?",o:["MAC","IP","Port","VLAN"],a:"IP"},
{q:"Which stores MAC table?",o:["Router","Switch","Hub","Firewall"],a:"Switch"},
{q:"Hub works in?",o:["Half duplex","Full duplex","Both","None"],a:"Half duplex"},
{q:"Switch default?",o:["Half","Full","Auto","None"],a:"Full"},
{q:"CSMA/CD used in?",o:["Hub","Switch","Router","Fiber"],a:"Hub"},
{q:"NAT expands?",o:["IP","MAC","Port","VLAN"],a:"IP"},
{q:"PAT uses?",o:["IP only","MAC","IP+Port","DNS"],a:"IP+Port"},
{q:"DHCP provides?",o:["IP","MAC","Gateway","All"],a:"All"},

{q:"APIPA range?",o:["10.x.x.x","172.x.x.x","192.168.x.x","169.254.x.x"],a:"169.254.x.x"},
{q:"Gateway purpose?",o:["Local routing","Inter-network","DNS","MAC"],a:"Inter-network"},
{q:"Which cable longest?",o:["Cat5","Cat6","Coax","Fiber"],a:"Fiber"},
{q:"Straight cable used for?",o:["PC-PC","PC-Switch","Switch-Switch","Router-Router"],a:"PC-Switch"},
{q:"Cross cable?",o:["PC-Switch","PC-PC","PC-Router","Console"],a:"PC-PC"},
{q:"Console cable used for?",o:["Data","Internet","Config","Routing"],a:"Config"},
{q:"OSI layer encryption?",o:["Session","Transport","Presentation","Application"],a:"Presentation"},
{q:"End-to-end delivery?",o:["Layer 2","Layer 3","Layer 4","Layer 5"],a:"Layer 4"},
{q:"HTTP is?",o:["Stateless","Stateful","Secure","Encrypted"],a:"Stateless"},

{q:"Firewall works at?",o:["L1","L2","L3","L3 & L4"],a:"L3 & L4"},
{q:"IDS means?",o:["Intrusion Detection System","Internet Data System","Internal Detection","None"],a:"Intrusion Detection System"},
{q:"VPN provides?",o:["Speed","Security","Broadcast","MAC"],a:"Security"},
{q:"SSL used in?",o:["FTP","HTTP","HTTPS","SMTP"],a:"HTTPS"},
{q:"Default VLAN?",o:["0","1","10","100"],a:"1"},
{q:"VLAN reduces?",o:["Collision","Broadcast","Speed","Security"],a:"Broadcast"},
{q:"STP prevents?",o:["Broadcast","Loop","Collision","Delay"],a:"Loop"},
{q:"Switch loop causes?",o:["Storm","Slow","Crash","Hang"],a:"Storm"},
{q:"MAC address is?",o:["Logical","Physical","Virtual","Dynamic"],a:"Physical"},
{q:"IP address is?",o:["Physical","Logical","Virtual","MAC"],a:"Logical"}
];

/* ================== EXAM LOGIC ================== */
let time = 3*60*60;
let interval;

function startExam(){
  if(document.getElementById("student").value==""){
    alert("Enter Student Name");
    return;
  }
  const quiz=document.getElementById("quiz");
  quiz.innerHTML="";
  questions.forEach((q,i)=>{
    quiz.innerHTML+=`
    <div class="question">
    <p>${i+1}. ${q.q}</p>
    ${q.o.map(opt=>`
      <label>
      <input type="radio" name="q${i}" value="${opt}">
      ${opt}
      </label><br>`).join("")}
    </div>`;
  });
  interval=setInterval(timer,1000);
}

function timer(){
  let h=Math.floor(time/3600);
  let m=Math.floor((time%3600)/60);
  let s=time%60;
  document.getElementById("timer").innerText=`Time Left: ${h}:${m}:${s}`;
  if(time--<=0) submitExam();
}

function submitExam(){
  clearInterval(interval);
  let score=0;
  questions.forEach((q,i)=>{
    let ans=document.querySelector(`input[name=q${i}]:checked`);
    if(ans && ans.value===q.a) score++;
  });
  document.getElementById("result").innerText=
  `Score: ${score}/100`;
}
</script>

</body>
</html>
