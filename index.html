<!DOCTYPE html>
<html>
<head>
  <title>CCNA 100 Marks Quiz</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
      background: rgba(0,0,0,0.7);
      border-radius: 15px;
      margin-top: 50px;
    }
    h1, h2 {
      text-align: center;
      color: #ffd700;
    }
    .instruction, #quiz-form, #complete-message {
      display: none;
    }
    label {
      font-size: 16px;
    }
    input[type="text"] {
      padding: 5px;
      font-size: 16px;
      width: 250px;
      margin-top: 10px;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 8px;
    }
    .question {
      margin-bottom: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
    }
    #timer {
      font-size: 20px;
      text-align: center;
      margin-bottom: 15px;
      color: #ff4c4c;
    }
    #message {
      font-size: 18px;
      text-align: center;
      margin-bottom: 15px;
      color: #00ffff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CCNA 100 Marks Quiz</h1>

    <div class="instruction" id="instruction">
      <h2>Instructions</h2>
      <p><strong>Total Questions:</strong> 100</p>
      <p><strong>Duration:</strong> 3 Hours</p>
      <p><strong>Each Question Carries:</strong> 1 mark</p>
      <p><strong>Negative Marking:</strong> None</p>
      <p><strong>Auto Scroll:</strong> Enabled</p>
      <p><strong>Important:</strong> Do not refresh your browser during the exam</p>

      <label>
        Enter Student Name:
        <input type="text" id="student-name" placeholder="Your name">
      </label><br>

      <button id="start-btn">Start Exam</button>
    </div>

    <div id="message">Exam will start at 25-Jan-2026 11:00 AM</div>
    <div id="timer"></div>
    <form id="quiz-form"></form>
    <button id="submit-btn" style="display:none;">Submit Exam</button>
    <div id="complete-message"></div>
  </div>

<script>
  // ---------------- QUESTIONS ----------------
  const questions = [
    {q:"Which device operates at Layer 1 of the OSI model?", options:["Switch","Router","Hub","Firewall"], answer:"Hub"},
    {q:"Which cable is commonly used for connecting a PC to a switch?", options:["Coaxial cable","Fiber optic cable","Straight-through Ethernet cable","Console cable"], answer:"Straight-through Ethernet cable"},
    {q:"A broadcast domain is created by which device?", options:["Hub","Switch","Router","Repeater"], answer:"Router"},
    // (Questions unchanged – same as your original file)
    {q:"Which command saves configuration to NVRAM?", options:["copy running-config startup-config","write erase","reload","show run"], answer:"copy running-config startup-config"}
  ];

  // ---------------- ELEMENTS ----------------
  const instructionDiv = document.getElementById('instruction');
  const startBtn = document.getElementById('start-btn');
  const studentNameInput = document.getElementById('student-name');
  const messageDiv = document.getElementById('message');
  const quizForm = document.getElementById('quiz-form');
  const submitBtn = document.getElementById('submit-btn');
  const timerDiv = document.getElementById('timer');
  const completeMsgDiv = document.getElementById('complete-message');

  // ✅ EXAM DATE & TIME UPDATED
  const examStart = new Date("2026-01-25T11:00:00");
  const examDuration = 3 * 60 * 60;

  let timer = examDuration;
  let interval;

  instructionDiv.style.display = 'block';

  startBtn.addEventListener('click', () => {
    const now = new Date();

    if (now < examStart) {
      alert("Exam has not started yet. Please wait until 11:00 AM on 25-Jan-2026.");
      return;
    }

    const studentName = studentNameInput.value.trim();
    if (studentName === "") {
      alert("Please enter your name");
      return;
    }

    instructionDiv.style.display = 'none';
    messageDiv.innerText = "Exam Started!";
    quizForm.style.display = 'block';
    submitBtn.style.display = 'inline-block';

    questions.forEach((q, index) => {
      const div = document.createElement('div');
      div.className = 'question';
      div.id = `q${index}`;
      div.innerHTML =
        `<p>${index + 1}. ${q.q}</p>` +
        q.options.map(opt =>
          `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label><br>`
        ).join('');
      quizForm.appendChild(div);

      div.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', () => {
          const next = document.getElementById(`q${index + 1}`);
          if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    });

    interval = setInterval(() => {
      let h = Math.floor(timer / 3600);
      let m = Math.floor((timer % 3600) / 60);
      let s = timer % 60;

      timerDiv.innerText =
        `${h.toString().padStart(2,'0')}:` +
        `${m.toString().padStart(2,'0')}:` +
        `${s.toString().padStart(2,'0')}`;

      if (timer <= 0) {
        clearInterval(interval);
        submitExam();
      }
      timer--;
    }, 1000);
  });

  submitBtn.addEventListener('click', submitExam);

  function submitExam() {
    const studentName = studentNameInput.value.trim() || "Unknown";
    let score = 0;

    questions.forEach((q, index) => {
      const ans = document.querySelector(`input[name="q${index}"]:checked`);
      if (ans && ans.value === q.answer) score++;
    });

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("CCNA Exam Report", 10, 10);
    doc.text(`Student: ${studentName}`, 10, 20);
    doc.text(`Score: ${score}/${questions.length}`, 10, 30);
    doc.save("CCNA_Exam_Report.pdf");

    const whatsappNumber = "9353744038";
    const waMsg = `CCNA Exam Report\nStudent: ${studentName}\nScore: ${score}/${questions.length}`;
    window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(waMsg)}`, "_blank");

    const email = "msminfotech25@gmail.com";
    const subject = "CCNA Exam Report";
    const body = `Student: ${studentName}\nScore: ${score}/${questions.length}`;
    window.open(`mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);

    completeMsgDiv.style.display = 'block';
    completeMsgDiv.innerText =
      "Exam completed! For any queries contact MSM Info Tech: 9353744038 / msminfotech25@gmail.com";

    clearInterval(interval);
  }
</script>
</body>
</html>
